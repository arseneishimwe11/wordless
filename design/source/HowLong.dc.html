<script type="text/x-dc" data-dc-script data-props='{"initial":{"editor":"enum","options":["filled","missing","ongoing"],"default":"filled"},"heading":{"editor":null,"default":"Young Serif"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

g(k) {
  const s = this.state || {};
  if (s[k] !== undefined) return s[k];
  const INIT = {
    filled:  { days: 7, unit: 'days', ongoing: false, err: 0 },
    missing: { days: null, unit: 'days', ongoing: false, err: 1 },
    ongoing: { days: null, unit: 'days', ongoing: true, err: 0 }
  };
  const b = INIT[this.props.initial] || INIT.filled;
  if (k === 'anim') return 0;
  return b[k];
}

set(o) { this.setState(Object.assign({ anim: (this.g('anim') || 0) + 1, err: 0 }, o)); }

renderVals() {
  const HEADS = {"Young Serif": {"name": "Young Serif", "f": "'Young Serif',Georgia,serif", "w": "400", "st": "100%", "ls": "-0.01em", "k": "0.92", "kind": "heavy old-style serif", "note": "Heavy and bookish: a picture book with grown-up manners."}};
  const hd = HEADS[this.props.heading] || HEADS['Young Serif'];
  const days = this.g('days'), unit = this.g('unit'), ongoing = this.g('ongoing'), err = this.g('err') || 0, anim = this.g('anim') || 0;
  const total = ongoing ? 7 : (days ? days * (unit === 'weeks' ? 7 : 1) : 0);
  const missing = !ongoing && !total;
  const shownDays = missing ? 7 : Math.min(14, total);
  const cls = anim % 2 ? 'wl-popA' : 'wl-popB';
  const weeks = [];
  for (let w = 0; w * 7 < shownDays; w++) {
    const list = [];
    for (let d = w * 7; d < Math.min(shownDays, w * 7 + 7); d++) {
      list.push({ n: missing ? '·' : String(d + 1), bs: missing ? 'dashed' : 'solid', cls: missing ? '' : cls, delay: Math.min(d * 45, 600) + 'ms' });
    }
    weeks.push({ days: list, op: missing ? '0.45' : '1' });
  }
  const doses = total * 3;
  const more = !missing && !ongoing && total > 14 ? total - 14 : 0;
  const quick = {};
  [5, 7, 10, 14].forEach((n) => {
    const on = !ongoing && unit === 'days' && days === n;
    quick['q' + n] = { on: on, bg: on ? '#F2A516' : '#FBF6EA', tap: () => this.set({ days: n, unit: 'days', ongoing: false }) };
  });
  const segU = (u) => ({ on: unit === u, bg: unit === u ? '#1F1C33' : '#FBF6EA', fg: unit === u ? '#F6EEDD' : '#1F1C33', tap: () => this.set({ unit: u }) });
  let note = '', noteCol = '#3B3A8C', sum1 = '', sum2 = '', sumCol = '#1F1C33';
  if (ongoing) {
    note = 'no end date — the sheet shows one week; print a new one when it is full';
    sum1 = 'Ongoing · 3 a day, no end date'; sum2 = 'Keep going until the prescriber says stop.';
  } else if (missing) {
    note = 'how many days? the boxes need an end before they can be ticked';
    noteCol = err ? '#B4502E' : '#3B3A8C';
    sum1 = err ? 'Add how long first' : 'How long is missing'; sumCol = err ? '#B4502E' : '#1F1C33';
    sum2 = 'Type a number, or pick one of the usual lengths.';
  } else {
    note = 'done when the boxes are done' + (more ? ' — and ' + more + ' more days like these' : '');
    sum1 = total + (total === 1 ? ' day' : ' days') + ' · ' + doses + ' capsules in all';
    sum2 = 'The sheet will show ' + doses + ' boxes to tick, grouped by day.';
  }
  return Object.assign({
    hd: hd, weeks: weeks, note: note, noteCol: noteCol, sum1: sum1, sum2: sum2, sumCol: sumCol,
    daysStr: ongoing ? '' : (days ? String(days) : ''),
    inputBorder: missing && err ? '#B4502E' : '#1F1C33', inputBg: missing && err ? '#F9E6DC' : '#FBF6EA',
    inputCls: err ? (err % 2 ? 'wl-nudgeA' : 'wl-nudgeB') : '',
    ongoing: !!ongoing, showStamp: !missing && !ongoing, showRepeat: !!ongoing, valid: !missing, invalid: missing,
    noEnd: { on: !!ongoing, bg: ongoing ? '#F2A516' : '#FBF6EA', tap: () => this.set({ ongoing: !ongoing }) },
    u_days: segU('days'), u_weeks: segU('weeks'),
    setDays: (e) => { const n = parseInt(e.target.value, 10); this.set({ days: isNaN(n) || n < 1 ? null : Math.min(n, 90), ongoing: false }); },
    minus: () => this.set({ days: Math.max(1, (days || 8) - 1), ongoing: false }),
    plus: () => this.set({ days: Math.min(90, (days || 6) + 1), ongoing: false }),
    next: () => this.setState({ err: err + 1 })
  }, quick);
}
