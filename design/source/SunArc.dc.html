g(k) {
  const s = this.state || {};
  if (s[k] !== undefined) return s[k];
  const INIT = {
    empty:  { mode: 'fixed', doses: [], med: 'amox', every: 8, max: 4, sunA: 172, err: 0, touched: false },
    fixed3: { mode: 'fixed', doses: ['sr', 'md', 'ss'], med: 'amox', every: 8, max: 4, sunA: 90, err: 0, touched: true },
    every8: { mode: 'every', doses: ['sr', 'af', 'nt'], med: 'amox', every: 8, max: 4, sunA: 49, err: 0, touched: true },
    prn:    { mode: 'prn', doses: [], med: 'para', every: 8, max: 4, sunA: 172, err: 0, touched: true }
  };
  const b = INIT[this.props.initial] || INIT.empty;
  if (k === 'delays') { const d = {}; b.doses.forEach((id, i) => { d[id] = 380 + i * 190; }); return d; }
  return b[k];
}

S() {
  return {
    sr: { a: 172, name: 'sunrise', at: '6 am', tint: '#FBE3A0', sun: '#F2A516', slip: '#FBE3A0' },
    mm: { a: 131, name: 'mid-morning', at: '9 am', tint: '#FBE3A0', sun: '#F2A516', slip: '#FBE3A0' },
    md: { a: 90, name: 'midday', at: '12 noon', tint: '#F9CDBC', sun: '#EE7A5B', slip: '#F9CDBC' },
    af: { a: 49, name: 'afternoon', at: '3 pm', tint: '#F9CDBC', sun: '#EE7A5B', slip: '#F9CDBC' },
    ss: { a: 8, name: 'sunset', at: '6 pm', tint: '#EDB9A0', sun: '#B4502E', slip: '#EDB9A0' },
    nt: { a: -90, name: 'night', at: '10 pm', tint: '#DEDBF1', sun: '#2E2C6B', slip: '#CDCAEB' }
  };
}

order() { return ['sr', 'mm', 'md', 'af', 'ss', 'nt']; }

pos(t) {
  const r = t * Math.PI / 180;
  return { x: 195 + 150 * Math.cos(r), y: 232 - (t >= 0 ? 150 : 80) * Math.sin(r) };
}

nearest(t) {
  const S = this.S();
  let best = 'sr', bd = 1e9;
  this.order().forEach((id) => { const d = Math.abs(S[id].a - t); if (d < bd) { bd = d; best = id; } });
  return best;
}

dur(from, to) { return Math.min(950, 320 + Math.abs(to - from) * 2.6); }

animateSun(to, D) {
  cancelAnimationFrame(this.raf);
  const from = this.g('sunA');
  if (Math.abs(to - from) < 0.5) { this.setState({ sunA: to }); return; }
  const t0 = performance.now();
  const dur = D || this.dur(from, to);
  const ease = (t) => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    let v = from + (to - from) * ease(t);
    v = Math.max(-104, Math.min(186, v));
    this.setState({ sunA: t >= 1 ? to : v });
    if (t < 1) this.raf = requestAnimationFrame(step);
  };
  this.raf = requestAnimationFrame(step);
}

place(list, mode, extra) {
  const S = this.S();
  const delays = {};
  list.forEach((id, i) => { delays[id] = 90 + i * 170; });
  const first = list.length ? S[list[0]].a : 172;
  const last = list.length ? S[list[list.length - 1]].a : 172;
  this.setState(Object.assign({ mode: mode, doses: list.slice(), delays: delays, err: 0, touched: true, sunA: first }, extra || {}));
  if (list.length > 1) {
    const D = 90 + (list.length - 1) * 170 + 260;
    setTimeout(() => this.animateSun(last, D), 20);
  }
}

tapStop(id) {
  if (this.g('mode') === 'prn') return;
  const S = this.S();
  const doses = this.g('doses').slice();
  const i = doses.indexOf(id);
  const D = this.dur(this.g('sunA'), S[id].a);
  const delays = Object.assign({}, this.g('delays'));
  if (i >= 0) doses.splice(i, 1); else { doses.push(id); delays[id] = Math.round(D * 0.62); }
  const order = this.order();
  doses.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  this.setState({ doses: doses, delays: delays, mode: 'fixed', err: 0, touched: true });
  this.animateSun(S[id].a, D);
}

stepSun(dir) {
  const order = this.order();
  const cur = this.nearest(this.g('sunA'));
  const j = Math.max(0, Math.min(order.length - 1, order.indexOf(cur) + dir));
  this.setState({ touched: true });
  this.animateSun(this.S()[order[j]].a);
}

pointerAngle(e) {
  const stage = e.currentTarget.closest('[data-arc]');
  if (!stage) return this.g('sunA');
  const r = stage.getBoundingClientRect();
  const s = r.width / 390 || 1;
  const px = (e.clientX - r.left) / s, py = (e.clientY - r.top) / s;
  const dx = px - 195, dy = 232 - py;
  let t;
  if (dy >= 0) t = Math.atan2(dy, dx) * 180 / Math.PI;
  else {
    t = Math.atan2(dy * 150 / 80, dx) * 180 / Math.PI;
    if (t < -90) t = t < -150 ? 180 : -90;
  }
  return Math.max(-90, Math.min(180, t));
}

sunDown(e) {
  if (this.g('mode') === 'prn') return;
  cancelAnimationFrame(this.raf);
  this.justDragged = false;
  this.drag = { x0: e.clientX, y0: e.clientY, moved: false };
  if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
}

sunMove(e) {
  if (!this.drag) return;
  if (!this.drag.moved && Math.hypot(e.clientX - this.drag.x0, e.clientY - this.drag.y0) < 6) return;
  this.drag.moved = true;
  this.setState({ sunA: this.pointerAngle(e), touched: true, dragging: true });
}

sunUp(e) {
  if (!this.drag) return;
  const moved = this.drag.moved;
  this.drag = null;
  if (!moved) return;
  this.justDragged = true;
  const S = this.S();
  const id = this.nearest(this.g('sunA'));
  const D = this.dur(this.g('sunA'), S[id].a);
  const doses = this.g('doses').slice();
  const delays = Object.assign({}, this.g('delays'));
  if (doses.indexOf(id) < 0) {
    doses.push(id);
    const order = this.order();
    doses.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    delays[id] = Math.round(D * 0.55);
  }
  this.setState({ dragging: false, doses: doses, delays: delays, mode: 'fixed', err: 0 });
  this.animateSun(S[id].a, D);
}

sunClick() {
  if (this.justDragged) { this.justDragged = false; return; }
  this.tapStop(this.nearest(this.g('sunA')));
}

sunKey(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); this.stepSun(-1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); this.stepSun(1); }
}

names(list) {
  const S = this.S();
  const n = list.map((id) => S[id].name);
  if (n.length > 4) return n.length + ' times, ' + n[0] + ' to ' + n[n.length - 1];
  if (n.length <= 1) return n.join('');
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

renderVals() {
  const HEADS = {"Young Serif": {"name": "Young Serif", "f": "'Young Serif',Georgia,serif", "w": "400", "st": "100%", "ls": "-0.01em", "k": "0.92", "kind": "heavy old-style serif", "note": "Heavy and bookish: a picture book with grown-up manners."}};
  const hd = HEADS[this.props.heading] || HEADS['Young Serif'];
  const S = this.S();
  const order = this.order();
  const mode = this.g('mode');
  const prn = mode === 'prn';
  const doses = this.g('doses');
  const med = this.g('med');
  const every = this.g('every');
  const max = this.g('max');
  const sunA = this.g('sunA');
  const err = this.g('err') || 0;
  const delays = this.g('delays') || {};
  const near = this.nearest(sunA);
  const p = this.pos(sunA);
  const has = (id) => doses.indexOf(id) >= 0;
  const qty = med === 'amox' ? '1 capsule' : '1 tablet';
  const TIMES = { 1: ['sr'], 2: ['sr', 'ss'], 3: ['sr', 'md', 'ss'], 4: ['sr', 'md', 'ss', 'nt'] };
  const EVERY = { 4: ['sr', 'mm', 'md', 'af', 'ss', 'nt'], 6: ['sr', 'md', 'ss', 'nt'], 8: ['sr', 'af', 'nt'], 12: ['sr', 'ss'] };
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  const v = {};
  order.forEach((id) => {
    const on = has(id) && !prn;
    v['s_' + id] = {
      on: on,
      delay: (delays[id] || 0) + 'ms',
      ring: on ? ('0 0 0 5px ' + S[id].tint + ', 0 0 0 7.5px #1F1C33') : 'none',
      aria: this.cap(S[id].name) + ', about ' + S[id].at + (on ? ': dose set, tap to remove' : ': tap to add a dose'),
      tap: () => this.tapStop(id)
    };
  });

  const seg = (key, on, fn) => ({ pressed: on, bg: on ? '#1F1C33' : '#FBF6EA', fg: on ? '#F6EEDD' : '#1F1C33', tap: fn });
  v.seg_fixed = seg('fixed', mode === 'fixed', () => this.setState({ mode: 'fixed', touched: true, err: 0 }));
  v.seg_every = seg('every', mode === 'every', () => this.place(EVERY[this.g('every')], 'every'));
  v.seg_prn = seg('prn', prn, () => { cancelAnimationFrame(this.raf); this.setState({ mode: 'prn', touched: true, err: 0 }); });

  [1, 2, 3, 4].forEach((n) => {
    const on = mode === 'fixed' && same(doses, TIMES[n]);
    v['t' + n] = { pressed: on, bg: on ? '#F2A516' : '#FBF6EA', tap: () => this.place(TIMES[n], 'fixed') };
  });
  [4, 6, 8, 12].forEach((h) => {
    const on = mode === 'every' && every === h;
    v['e' + h] = { pressed: on, bg: on ? '#F2A516' : '#FBF6EA', tap: () => this.place(EVERY[h], 'every', { every: h }) };
  });

  const list = order.filter(has);
  let big = '', bigSize = '50px', small = '', sum1 = '', sum2 = '', sumCol = '#1F1C33';
  if (prn) {
    big = 'up to ' + max; bigSize = '30px'; small = 'a day, if needed';
    sum1 = 'Only when needed';
    sum2 = qty + ' at a time, never more than ' + max + ' in a day';
  } else if (!list.length) {
    big = '0'; small = 'a day';
    sum1 = err ? 'Add at least one time first' : 'No times yet';
    sumCol = err ? '#B4502E' : '#1F1C33';
    sum2 = 'Tap a time on the sky, or choose how many a day.';
  } else if (mode === 'every') {
    big = every + ' h'; bigSize = '38px'; small = 'apart · ' + list.length + ' a day';
    sum1 = 'Every ' + every + ' h: ' + this.names(list);
    sum2 = 'about ' + list.map((id) => S[id].at).join(' · ');
  } else {
    big = String(list.length); small = 'a day';
    sum1 = this.cap(this.names(list));
    sum2 = (list.length <= 3 ? qty + ' each time · ' : '') + 'about ' + list.map((id) => S[id].at).join(' · ');
  }

  const n = Math.max(1, Math.min(6, max));
  const prnChips = [];
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? 90 : 160 - i * (140 / (n - 1));
    const r = a * Math.PI / 180;
    prnChips.push({ amox: med === 'amox', para: med !== 'amox', left: (195 + 98 * Math.cos(r) - 21).toFixed(1) + 'px', top: (232 - 98 * Math.sin(r) - 21).toFixed(1) + 'px', delay: (i * 90) + 'ms' });
  }

  const isNight = sunA < -4;
  const empty = !prn && !list.length;
  return Object.assign(v, {
    prn: prn, amox: med === 'amox', para: med === 'para',
    isFixed: mode === 'fixed', isEvery: mode === 'every', isPrn: prn,
    medName: med === 'amox' ? 'Amoxicillin 500 mg' : 'Paracetamol',
    medSub: qty + ' each time',
    showSun: !prn, isDay: !isNight, isNight: isNight,
    sunL: p.x.toFixed(1) + 'px', sunT: p.y.toFixed(1) + 'px',
    sunCol: S[near].sun, sunSlip: S[near].slip,
    sunAria: 'The sun, now at ' + S[near].name + '. Drag it along the sky or use the arrow keys; press to ' + (has(near) ? 'remove the' : 'add a') + ' dose here.',
    nudgeCls: err ? (err % 2 ? 'wl-nudgeA' : 'wl-nudgeB') : '',
    skyTint: prn ? '#EFE6D2' : S[near].tint,
    bandOp: prn ? '0.35' : '1', stopsOp: prn ? '0.3' : '1',
    showHint: !this.g('touched'),
    hd: hd, big: big, bigSize: (parseFloat(bigSize) * parseFloat(hd.k)).toFixed(1) + 'px', small: small,
    prnChips: prnChips, max: max,
    minus: () => this.setState({ max: Math.max(1, this.g('max') - 1) }),
    plus: () => this.setState({ max: Math.min(6, this.g('max') + 1) }),
    minusDis: max <= 1, plusDis: max >= 6,
    sum1: sum1, sum2: sum2, sumCol: sumCol,
    isEmpty: empty, notEmpty: !empty,
    nextBg: empty ? '#EEE2C6' : '#1F1C33', nextFg: empty ? '#1F1C33' : '#F6EEDD',
    nextShadow: empty ? 'none' : '4px 4px 0 #F2A516',
    next: () => { if (empty) this.setState({ err: err + 1 }); },
    clear: () => { cancelAnimationFrame(this.raf); this.setState({ doses: [], mode: mode === 'prn' ? 'prn' : 'fixed', err: 0, delays: {} }); this.animateSun(172); },
    sunDown: (e) => this.sunDown(e), sunMove: (e) => this.sunMove(e), sunUp: (e) => this.sunUp(e),
    sunClick: () => this.sunClick(), sunKey: (e) => this.sunKey(e)
  });
}

}
</script>
</body>
